# ==========================================================
# Database Configuration for Web Crawler
# ==========================================================

# Database engine: 'mysql' (for XAMPP phpMyAdmin) or 'sqlite'
db.type=mysql

# MySQL Settings (Default XAMPP configuration)
mysql.host=localhost
mysql.port=3306
mysql.database=crawler_db
mysql.username=root
mysql.password=

# SQLite fallback path (used when db.type=sqlite or if MySQL is offline)
sqlite.path=data/crawler.db
